<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Jugador {{ dorsal }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/statsjornada.css') }}">
</head>
<body>
    <h2>Estadísticas del Jugador {{ dorsal }}</h2>

    <table>
        <thead>
            <tr>
                {% for col in columnas %}
                <th>{{ col.label }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for j in jornadas %}
            <tr class="{% if j['jornada'] == 'Media' %}totals-row{% endif %}">
                {% for col in columnas %}
                <td>{{ j[col.name] }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script src="{{ url_for('static', path='/js/statsjornada.js') }}"></script>
</body>
</html>
