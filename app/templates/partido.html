<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Jornada {{ jornada }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/partido.css') }}">
</head>

<body>
    <div style="width:100%; text-align: center;">
        <h1>Jornada: {{ jornada }}</h1>
        <h2>Rival: {{ rival }} | Casa: {{ casa }}</h2>
        <button style="padding: 15px;">
            <a href="{{ url_for('statsjornada', jornada=jornada) }}" target="_blank">Veure dades del partit</a>
        </button>
    </div>

    <!-- hidden partido-id -->
    <input type="hidden" id="partido-id" value="{{ jornada }}">

    <!-- Column of dorsals -->
    <div class="dorsales">
        {% for d in dorsales %}
        <button class="dorsal-button" data-dorsal="{{ d }}">{{ d }}</button>
        {% endfor %}
    </div>

    <!-- Action buttons -->
    <div class="acciones">
        {% for columna in columnas %}
        <button class="accion-button action-button" data-action="{{ columna }}">
            {{ columna.replace('_', ' ').capitalize() }}
        </button>
        {% endfor %}
    </div>

    <div class="mensaje" id="mensaje"></div>

    <script src="{{ url_for('static', path='/js/partido.js') }}"></script>
</body>

</html>
