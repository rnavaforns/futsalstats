<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Jornada {{ jornada }}</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 20px;
        }

        h1,
        h2 {
            text-align: center;
            width: 100%;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-start;
            flex: 1;
            align-content: flex-start;
        }

        .dorsales {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f8f8;
        }

        .dorsal-button {
            padding: 6px 10px;
            font-size: 14px;
            width: 40px;
            text-align: center;
        }

        .dorsal-button.active {
            background-color: lightgreen;
            font-weight: bold;
        }

        .dorsal-button.selected {
            background-color: lightblue;
            border: 2px solid blue;
        }

        .accion-button {
            padding: 6px 10px;
            font-size: 13px;
            min-width: 100px;
            white-space: nowrap;
        }

        .mensaje {
            text-align: center;
            margin-top: 10px;
            color: green;
            width: 100%;
        }
    </style>
</head>

<body>
    <div style="width:100%">
        <h1>Jornada: {{ jornada }}</h1>
        <h2>Rival: {{ rival }} | Casa: {{ casa }}</h2>
    </div>

    <!-- hidden partido-id -->
    <input type="hidden" id="partido-id" value="{{ jornada }}">

    <!-- Column of dorsals -->
    <div class="dorsales">
        {% for d in range(1, 16) %}
        <button class="dorsal-button" data-dorsal="{{ d }}">{{ d }}</button>
        {% endfor %}
    </div>

    <!-- Action buttons -->
    <div class="acciones">
        {% for columna in columnas %}
        <button class="accion-button action-button" data-action="{{ columna }}">
            {{ columna.replace('_', ' ').capitalize() }}
        </button>
        {% endfor %}
    </div>

    <div class="mensaje" id="mensaje"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const partidoId = document.getElementById("partido-id").value;
            let activos = [];             // up to 4
            let dorsalSeleccionado = null; // target for next action

            // Handle dorsal buttons
            document.querySelectorAll(".dorsal-button").forEach(button => {
                button.addEventListener("click", () => {
                    const dorsal = parseInt(button.dataset.dorsal);

                    // If already active -> deselect
                    if (activos.includes(dorsal)) {
                        activos = activos.filter(d => d !== dorsal);
                        button.classList.remove("active", "selected");
                        if (dorsalSeleccionado === dorsal) {
                            dorsalSeleccionado = null;
                        }
                        return;
                    }

                    // If not active and less than 4 -> activate
                    if (activos.length < 4) {
                        activos.push(dorsal);
                        button.classList.add("active");

                        // Make it the selected one automatically
                        if (!dorsalSeleccionado) {
                            dorsalSeleccionado = dorsal;
                            button.classList.add("selected");
                        }
                    } else {
                        alert("Sólo puedes tener 4 dorsales activos.");
                    }
                });

                // Right-click to set as selected (among active)
                button.addEventListener("contextmenu", (ev) => {
                    ev.preventDefault();
                    const dorsal = parseInt(button.dataset.dorsal);
                    if (!activos.includes(dorsal)) {
                        alert("Primero marca el dorsal como activo.");
                        return;
                    }
                    dorsalSeleccionado = dorsal;

                    // Remove selection highlight from others
                    document.querySelectorAll(".dorsal-button").forEach(btn => btn.classList.remove("selected"));
                    button.classList.add("selected");
                });
            });

            // Handle action buttons
            document.querySelectorAll(".action-button").forEach(button => {
                button.addEventListener("click", async () => {
                    if (!dorsalSeleccionado) {
                        mostrarMensaje("Selecciona un dorsal activo primero", true);
                        return;
                    }

                    const columna = button.dataset.action;

                    try {
                        const response = await fetch(`/partido/${partidoId}/accion/${columna}/${dorsalSeleccionado}`, {
                            method: "POST"
                        });

                        if (!response.ok) throw new Error("Error en la petición");

                        const result = await response.json();
                        if (result.ok) {
                            mostrarMensaje(`+1 en ${columna} (Dorsal ${dorsalSeleccionado})`);
                        }
                    } catch (error) {
                        console.error("Error al actualizar acción:", error);
                        mostrarMensaje("Error al actualizar", true);
                    }
                });
            });

            function mostrarMensaje(texto, error = false) {
                const mensajeDiv = document.getElementById('mensaje');
                mensajeDiv.style.color = error ? 'red' : 'green';
                mensajeDiv.innerText = texto;
                setTimeout(() => {
                    mensajeDiv.innerText = '';
                }, 2000);
            }
        });

    </script>
</body>

</html>
