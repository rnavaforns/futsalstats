<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Jornada {{ jornada }}</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 20px;
        }

        h1,
        h2 {
            text-align: center;
            width: 100%;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-start;
            flex: 1;
            align-content: flex-start;
        }

        .dorsales {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f8f8;
        }

        .dorsal-button {
            padding: 6px 10px;
            font-size: 14px;
            width: 40px;
            text-align: center;
        }

        .dorsal-button.selected {
            background-color: lightblue;
            font-weight: bold;
        }

        .accion-button {
            padding: 6px 10px;
            font-size: 13px;
            min-width: 100px;
            white-space: nowrap;
        }

        .mensaje {
            text-align: center;
            margin-top: 10px;
            color: green;
            width: 100%;
        }
    </style>
</head>

<body>
    <div style="width:100%">
        <h1>Jornada: {{ jornada }}</h1>
        <h2>Rival: {{ rival }} | Casa: {{ casa }}</h2>
    </div>

    <!-- Column of dorsals -->
    <div class="dorsales">
        {% for d in range(1, 16) %}
        <button class="dorsal-button" onclick="seleccionarDorsal({{ d }})">{{ d }}</button>
        {% endfor %}
    </div>

    <!-- Action buttons -->
    <div class="acciones">
        {% for columna in columnas %}
        <button class="accion-button" onclick="enviarAccion('{{ columna }}')">
            {{ columna.replace('_', ' ').capitalize() }}
        </button>
        {% endfor %}
    </div>

    <div class="mensaje" id="mensaje"></div>

    <script>
        let dorsalSeleccionado = null;

        function seleccionarDorsal(dorsal) {
            dorsalSeleccionado = dorsal;

            // Highlight selected
            document.querySelectorAll('.dorsal-button').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function enviarAccion(columna) {
            if (!dorsalSeleccionado) {
                mostrarMensaje("Selecciona un dorsal primero", true);
                return;
            }

            fetch(`/partido/{{ jornada }}/accion/${columna}/${dorsalSeleccionado}`, {
                method: 'POST'
            })
                .then(response => {
                    if (response.ok) {
                        mostrarMensaje(`+1 en ${columna} (Dorsal ${dorsalSeleccionado})`);
                    } else {
                        mostrarMensaje('Error al actualizar', true);
                    }
                });
        }

        function mostrarMensaje(texto, error = false) {
            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.style.color = error ? 'red' : 'green';
            mensajeDiv.innerText = texto;
            setTimeout(() => {
                mensajeDiv.innerText = '';
            }, 2000);
        }
    </script>
</body>

</html>
